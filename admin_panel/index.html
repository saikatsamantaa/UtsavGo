
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UtsavGo Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}
header {
    background: linear-gradient(120deg, #673ab7, #ff7043);
    color: white;
    padding: 20px;
}
header h2 { margin: 0; }
.container {
    max-width: 900px;
    margin: 20px auto;
    padding: 15px;
}
.box, .event {
    background: white;
    padding: 18px;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px #00000012;
}
input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 7px;
}
button {
    border: 0;
    padding: 11px 16px;
    margin: 5px 3px 5px 0;
    border-radius: 7px;
    color: white;
    background: #673ab7;
    font-weight: bold;
}
.approve { background: #168a45; }
.reject { background: #d32f2f; }
.logout { background: #333; }
.tabs button { background: #555; }
.tabs button.active { background: #673ab7; }
img {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 8px;
}
.small { color: #666; font-size: 13px; }
#dashboard { display: none; }
#message { color: #d32f2f; }
</style>
</head>

<body>

<header>
    <h2>🎉 UtsavGo Admin Panel</h2>
    <p>Discover. Connect. Celebrate.</p>
</header>

<div class="container">

    <div class="box" id="loginBox">
        <h2>Admin Login</h2>
        <input type="email" id="email" placeholder="Admin Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="message"></p>
    </div>

    <div id="dashboard">
        <div class="box">
            <h2>Welcome, Admin!</h2>
            <button class="logout" onclick="logout()">Logout</button>
        </div>

        <div class="box tabs">
            <button id="pendingTab" class="active" onclick="loadEvents('pending')">Pending</button>
            <button id="approvedTab" onclick="loadEvents('approved')">Approved</button>
            <button id="rejectedTab" onclick="loadEvents('rejected')">Rejected</button>
        </div>

        <div id="eventList"></div>
    </div>

</div>

<script>
const SUPABASE_URL = "https://lutcdpnwhpwadxttlgze.supabase.co";

const SUPABASE_KEY = "sb_publishable_YK1izeYNqP4sqTCiQ9W-7A_SPVD80Iv";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentStatus = "pending";

async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    message.style.color = "#d32f2f";
    message.innerText = "Checking login...";

    if (!email || !password) {
        message.innerText = "Email aur password dono bharo.";
        return;
    }

    const { data, error } = await db.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        message.innerText = error.message;
        return;
    }

    const { data: admin, error: adminError } = await db
        .from("admin_users")
        .select("user_id")
        .eq("user_id", data.user.id)
        .maybeSingle();

    if (adminError || !admin) {
        await db.auth.signOut();
        message.innerText = "Aap admin nahi hain.";
        return;
    }

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    loadEvents("pending");
}

async function logout() {
    await db.auth.signOut();
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("password").value = "";
    document.getElementById("message").innerText = "";
}

async function loadEvents(status) {
    currentStatus = status;

    ["pending", "approved", "rejected"].forEach(s => {
        document.getElementById(s + "Tab").classList.toggle("active", s === status);
    });

    const list = document.getElementById("eventList");
    list.innerHTML = "<div class='box'>Loading events...</div>";

    const { data, error } = await db
        .from("events")
        .select("*")
        .eq("status", status)
        .order("created_at", { ascending: false });

    if (error) {
        list.innerHTML = "<div class='box'>Error: " + escapeHTML(error.message) + "</div>";
        return;
    }

    if (!data || data.length === 0) {
        list.innerHTML = "<div class='box'>No " + status + " events found.</div>";
        return;
    }

    list.innerHTML = "";

    data.forEach(event => {
        const card = document.createElement("div");
        card.className = "event";

        let photo = "";
        if (event.photo_url) {
            photo = `<img src="${escapeHTML(event.photo_url)}" alt="Event photo">`;
        }

        card.innerHTML = `
            ${photo}
            <h2>${escapeHTML(event.title)}</h2>
            <p><b>Category:</b> ${escapeHTML(event.category)}</p>
            <p><b>Location:</b> ${escapeHTML(event.location_text)}</p>
            <p><b>Landmark:</b> ${escapeHTML(event.landmark || "Not given")}</p>
            <p><b>Date:</b> ${escapeHTML(event.event_date)}</p>
            <p><b>Time:</b> ${escapeHTML(event.event_time)}</p>
            <p><b>Description:</b> ${escapeHTML(event.description || "Not given")}</p>
            <p><b>Social Link:</b> ${event.social_link ? `<a href="${escapeHTML(event.social_link)}" target="_blank" rel="noopener">Open Link</a>` : "Not given"}</p>
            <p><b>Status:</b> ${escapeHTML(event.status)}</p>
            <p class="small">Submitted: ${escapeHTML(event.created_at)}</p>
            ${status === "pending" ? `
                <button class="approve" data-action="approve">Approve</button>
                <button class="reject" data-action="reject">Reject</button>
            ` : ""}
        `;

        if (status === "pending") {
            card.querySelector('[data-action="approve"]').onclick = () => updateEvent(event.id, "approved");
            card.querySelector('[data-action="reject"]').onclick = () => updateEvent(event.id, "rejected");
        }

        list.appendChild(card);
    });
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

async function updateEvent(id, newStatus) {
    const action = newStatus === "approved" ? "Approve" : "Reject";

    if (!confirm(action + " this event?")) return;

    const { error } = await db
        .from("events")
        .update({ status: newStatus })
        .eq("id", id);

    if (error) {
        alert("Error: " + error.message);
        return;
    }

    alert("Event " + newStatus + " successfully!");
    loadEvents(currentStatus);
}

async function checkSession() {
    const { data } = await db.auth.getSession();

    if (data.session) {
        const { data: admin } = await db
            .from("admin_users")
            .select("user_id")
            .eq("user_id", data.session.user.id)
            .maybeSingle();

        if (admin) {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            loadEvents("pending");
        } else {
            await db.auth.signOut();
        }
    }
}

checkSession();
</script>

</body>
</html>l
